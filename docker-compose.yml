# Local development dependencies. Run the Next.js app on the host with
# `pnpm dev`; this file provides Postgres and MinIO (S3-compatible storage).
#
#   pnpm docker:db      # just Postgres
#   pnpm docker:minio   # MinIO + one-shot bucket init
#
services:
  db:
    # pgvector image (superset of postgres:17) — enables the `vector` extension
    # used by the policy RAG knowledge base (spec v0.3.0).
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000' # S3 API — matches S3_ENDPOINT in .env.example
      - '9001:9001' # Web console (dev convenience only)
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Local mail catcher — SMTP on 1025, web UI + REST API on 8025. Used to
  # exercise the email flows (reset / verification) end-to-end in E2E without
  # sending real mail. See docs/email.md.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP — matches SMTP_PORT for local email
      - '8025:8025' # Web UI + API
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8025/readyz']
      interval: 5s
      timeout: 5s
      retries: 10

  # WardBeat AI plane (spec v0.2.0) — internal FastAPI barrier-extraction
  # service. Next.js reaches it at http://localhost:8000 in host dev, or
  # http://ai:8000 inside this network. Values are pulled from .env.
  ai:
    build: ./ai
    restart: unless-stopped
    environment:
      NIM_MOCK: ${NIM_MOCK:-true}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NIM_BASE_URL: ${NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NIM_EXTRACT_MODEL: ${NIM_EXTRACT_MODEL:-nvidia/nvidia-nemotron-nano-9b-v2}
      NIM_EMBED_MODEL: ${NIM_EMBED_MODEL:-nvidia/nv-embedqa-e5-v5}
      NIM_RERANK_MODEL: ${NIM_RERANK_MODEL:-nvidia/llama-3.2-nv-rerankqa-1b-v2}
      NIM_EXTRACT_MAX_TOKENS: ${NIM_EXTRACT_MAX_TOKENS:-3072}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
    ports:
      - '8000:8000' # dev convenience; keep internal-only (off the tunnel) in prod
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the app bucket, then exits. Safe to re-run (idempotent).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/app-files &&
      echo 'MinIO bucket ready'
      "
    restart: 'no'

volumes:
  pgdata:
  miniodata:
